<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개인 시간표</title>
  <!-- SheetJS (xlsx) CDN - 브라우저에서 엑셀을 직접 읽기 위해 사용 -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background: #f0f2f5;
      color: #222;
      padding: 24px;
      min-height: 100vh;
    }
    .container {
      max-width: 920px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    header {
      background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%);
      color: white;
      padding: 18px 24px;
      text-align: center;
    }
    header h1 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    header p {
      margin-top: 4px;
      font-size: 0.88rem;
      opacity: 0.85;
    }
    .controls {
      padding: 16px 20px;
      background: #f7fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }
    .controls.hidden {
      display: none !important;
    }
    .controls button, .controls label.btn {
      background: #2c5282;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .controls button:hover, .controls label.btn:hover {
      background: #1e3a5f;
    }
    .controls input[type="file"] {
      display: none;
    }
    .status {
      font-size: 0.85rem;
      color: #4a5568;
      text-align: center;
      width: 100%;
    }
    .status.error { color: #c53030; }
    .status.success { color: #276749; }

    .table-wrap {
      padding: 18px 16px 12px;
      overflow-x: auto;
      min-height: 200px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 0.92rem;
    }
    th, td {
      border: 1px solid #d1d5db;
      text-align: center;
      vertical-align: middle;
      padding: 8px 4px;
      height: 58px;
    }
    th {
      font-weight: 700;
      color: #fff;
      font-size: 0.95rem;
    }
    th.period {
      background: #4a5568;
      width: 78px;
      font-size: 0.88rem;
      line-height: 1.3;
    }
    th.period .time {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      opacity: 0.9;
      margin-top: 1px;
    }
    .empty { background: #f7fafc; }
    .cell-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      line-height: 1.2;
    }
    .cell-content .code {
      font-weight: 700;
      font-size: 1rem;
    }
    .cell-content .subject {
      font-size: 0.82rem;
      opacity: 0.95;
    }
    footer {
      text-align: center;
      padding: 10px 16px 16px;
      font-size: 0.78rem;
      color: #718096;
      border-top: 1px solid #edf2f7;
    }
    .placeholder {
      text-align: center;
      padding: 40px 20px;
      color: #718096;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    /* 모바일 대응 */
    @media (max-width: 640px) {
      body {
        padding: 8px;
      }
      .container {
        border-radius: 8px;
        max-width: 100%;
      }
      header {
        padding: 14px 12px;
      }
      header h1 {
        font-size: 1.2rem;
      }
      header p {
        font-size: 0.8rem;
      }
      .table-wrap {
        padding: 10px 6px 8px;
      }
      table {
        font-size: 0.8rem;
      }
      th, td {
        height: 48px;
        padding: 4px 2px;
      }
      th.period {
        width: 56px;
        font-size: 0.75rem;
      }
      th.period .time {
        font-size: 0.65rem;
      }
      .cell-content .code {
        font-size: 0.85rem;
      }
      .cell-content .subject {
        font-size: 0.7rem;
      }
      .controls {
        padding: 12px 10px;
        gap: 8px;
      }
      .controls button, .controls label.btn {
        padding: 8px 14px;
        font-size: 0.85rem;
      }
    }

    /* 아주 작은 화면 */
    @media (max-width: 380px) {
      th, td {
        height: 44px;
        padding: 3px 1px;
      }
      th.period {
        width: 48px;
        font-size: 0.7rem;
      }
      .cell-content .code {
        font-size: 0.78rem;
      }
      .cell-content .subject {
        font-size: 0.65rem;
      }
      header h1 {
        font-size: 1.1rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>개인 시간표</h1>
      <p id="date-range">table.xlsx를 불러오세요</p>

    </header>

    <div class="controls">
      <label class="btn">
        📂 엑셀 직접 선택
        <input type="file" id="fileInput" accept=".xlsx,.xls">
      </label>
      <button type="button" id="reloadBtn" style="display:none;">🔄 서버에서 다시 불러오기</button>

      <div class="status" id="status"></div>
    </div>

    <div class="table-wrap" id="tableArea">
      <div class="placeholder">
        서버에서 <strong>table.xlsx</strong>를 자동으로 불러오는 중...<br>
        실패하면 아래 버튼으로 직접 선택하세요.
      </div>
    </div>


    <footer>
      서버의 table.xlsx를 자동으로 읽어 시간표를 생성합니다 · 학급 번호별 색상 자동 적용
    </footer>

  </div>

  <script>
    // 학급 번호별 색상
    const COLOR_MAP = {
      "206": { bg: "#fed7d7", fg: "#9b2c2c" },
      "201": { bg: "#feebc8", fg: "#9c4221" },
      "205": { bg: "#c6f6d5", fg: "#276749" },
      "203": { bg: "#e9d8fd", fg: "#553c9a" },
      "107": { bg: "#bee3f8", fg: "#2b6cb0" },
    };

    const DAY_COLORS = ["#e53e3e", "#dd6b20", "#d69e2e", "#38a169", "#3182ce"];

    const fileInput = document.getElementById("fileInput");
    const statusEl = document.getElementById("status");
    const tableArea = document.getElementById("tableArea");
    const dateRangeEl = document.getElementById("date-range");
    const reloadBtn = document.getElementById("reloadBtn");

    let lastFile = null;

    // 서버에 올렸을 때 같은 폴더의 table.xlsx를 자동으로 불러옴
    const EXCEL_URL = "table.xlsx";   // HTML과 같은 경로에 두면 됩니다

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        lastFile = file;
        loadExcelFromFile(file);
      }
    });

    reloadBtn.addEventListener("click", () => {
      // 서버에서 다시 불러오기 우선, 없으면 마지막 선택 파일
      loadExcelFromServer().catch(() => {
        if (lastFile) loadExcelFromFile(lastFile);
      });
    });

    function setStatus(msg, type = "") {
      statusEl.textContent = msg;
      statusEl.className = "status " + type;
    }

    // 서버(또는 같은 폴더)에서 엑셀 파일 fetch
    async function loadExcelFromServer() {
      setStatus("서버에서 table.xlsx 불러오는 중...", "");
      try {
        const response = await fetch(EXCEL_URL + "?t=" + Date.now()); // 캐시 방지
        if (!response.ok) throw new Error("파일을 찾을 수 없습니다 (" + response.status + ")");

        const buffer = await response.arrayBuffer();
        processExcelData(new Uint8Array(buffer), "table.xlsx");
        // 성공적으로 로드되면 컨트롤 영역 숨김
        document.querySelector(".controls").classList.add("hidden");
        return true;

      } catch (err) {
        console.warn("자동 로드 실패:", err.message);
        setStatus("자동 로드 실패 → 파일을 직접 선택해주세요", "error");
        return false;
      }
    }

    // 사용자가 선택한 파일로 로드
    function loadExcelFromFile(file) {
      setStatus("읽는 중...", "");
      const reader = new FileReader();

      reader.onload = function (e) {
        try {
          processExcelData(new Uint8Array(e.target.result), file.name);
          // 성공적으로 로드되면 컨트롤 영역 숨김
          document.querySelector(".controls").classList.add("hidden");

        } catch (err) {
          console.error(err);
          setStatus("❌ 파일을 읽는 중 오류: " + err.message, "error");
          tableArea.innerHTML = `<div class="placeholder">오류가 발생했습니다.<br>${err.message}</div>`;
        }
      };

      reader.onerror = () => {
        setStatus("❌ 파일 읽기 실패", "error");
      };

      reader.readAsArrayBuffer(file);
    }

    // 공통 처리 함수
    function processExcelData(data, sourceName) {
      const workbook = XLSX.read(data, { type: "array" });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: null });

      if (!rows || rows.length < 2) {
        throw new Error("엑셀에 데이터가 없습니다.");
      }

      const { days, schedule } = parseSchedule(rows);
      renderTable(days, schedule);
      dateRangeEl.textContent = "";
    }

    // 페이지 로드 시 자동으로 서버의 table.xlsx 시도
    loadExcelFromServer();


    function parseSchedule(rows) {
      // rows[0] = ['교시', '월(24)', '화(25)', ...]
      const header = rows[0];
      // 날짜 부분 제거: "월(24)" → "월"
      const days = header.slice(1).map(h => {
        if (h == null) return "";
        return String(h).replace(/\s*\(\d+\)\s*$/, "").trim();
      });


      const schedule = [];
      let i = 1;

      while (i < rows.length) {
        const row = rows[i];
        const periodLabel = row[0];

        if (periodLabel == null || periodLabel === "") {
          i++;
          continue;
        }

        let periodNum = String(periodLabel).trim();
        let timeStr = "";

        if (periodNum.includes("(") && periodNum.includes(")")) {
          const open = periodNum.indexOf("(");
          const close = periodNum.indexOf(")");
          timeStr = periodNum.substring(open + 1, close);
          periodNum = periodNum.substring(0, open).trim();
        }

        // 코드 행
        const codes = row.slice(1).map(c => (c == null ? "" : String(c).trim()));

        // 다음 행이 과목 행인지 확인 (첫 열이 null인 경우)
        let subjects = new Array(codes.length).fill("");
        if (i + 1 < rows.length && (rows[i + 1][0] == null || rows[i + 1][0] === "")) {
          subjects = rows[i + 1].slice(1).map(s => (s == null ? "" : String(s).trim()));
          i += 2;
        } else {
          i += 1;
        }

        const cells = codes.map((code, idx) => ({
          code,
          subject: subjects[idx] || ""
        }));

        schedule.push({ period: periodNum, time: timeStr, cells });
      }

      return { days, schedule };
    }

    function renderTable(days, schedule) {
      let dayThs = "";
      days.forEach((day, idx) => {
        const color = DAY_COLORS[idx] || "#4a5568";
        dayThs += `<th style="background:${color}">${day}</th>`;
      });

      let bodyRows = "";
      for (const item of schedule) {
        const timeHtml = item.time ? `<span class="time">${item.time}</span>` : "";
        let cellsHtml = "";

        for (const cell of item.cells) {
          if (!cell.code && !cell.subject) {
            cellsHtml += `<td class="empty"></td>`;
          } else {
            const colors = COLOR_MAP[cell.code] || { bg: "#edf2f7", fg: "#4a5568" };
            const codeHtml = cell.code ? `<span class="code">${cell.code}</span>` : "";
            const subjHtml = cell.subject ? `<span class="subject">${cell.subject}</span>` : "";
            cellsHtml += `<td style="background:${colors.bg};color:${colors.fg}">
              <div class="cell-content">${codeHtml}${subjHtml}</div>
            </td>`;
          }
        }

        bodyRows += `
          <tr>
            <th class="period">${item.period}${timeHtml}</th>
            ${cellsHtml}
          </tr>`;
      }

      tableArea.innerHTML = `
        <table>
          <thead>
            <tr>
              <th class="period">교시</th>
              ${dayThs}
            </tr>
          </thead>
          <tbody>
            ${bodyRows}
          </tbody>
        </table>`;
    }

    // 드래그 앤 드롭 지원
    const dropZone = document.querySelector(".container");
    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "copy";
    });
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file && (file.name.endsWith(".xlsx") || file.name.endsWith(".xls"))) {
        lastFile = file;
        loadExcelFile(file);
      } else {
        setStatus("엑셀 파일(.xlsx)만 가능합니다.", "error");
      }
    });
  </script>
</body>
</html>
